<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clasificador Accesible de Billetes</title>

<style>
    body {
        font-family: Arial;
        background: #000;
        color: #fff;
        padding: 20px;
        text-align: center;
        font-size: 24px;
    }

    video {
        width: 90%;
        max-width: 450px;
        height: auto;
        border: 4px solid white;
        border-radius: 10px;
        margin: 20px auto;
        display: block;
    }

    button {
        width: 100%;
        padding: 28px;
        font-size: 28px;
        margin: 18px 0;
        border-radius: 18px;
        border: 3px solid white;
        background: #1a73e8;
        color: white;
        font-weight: bold;
    }

    button:focus {
        outline: 5px solid yellow;
    }

    h1, h2, h3 {
        margin-top: 20px;
    }
</style>
</head>
<body>

<h1 aria-live="assertive">Clasificador Accesible de Billetes</h1>

<!-- Vista previa cámara -->
<video id="camera" autoplay playsinline aria-label="Vista previa de cámara"></video>

<!-- Botones grandes -->
<button id="scanBtn" aria-label="Escanear billete">📷 Escanear Billete</button>
<button id="sumBtn" aria-label="Calcular la suma total">🧮 Terminar de Contar</button>
<button id="uploadBtn" aria-label="Subir imagen desde el dispositivo">📁 Subir Imagen</button>

<input type="file" id="imageInput" accept="image/*" style="display:none">

<h2 id="result" aria-live="assertive">Esperando instrucciones...</h2>

<h3>Historial:</h3>
<ul id="history" aria-live="polite"></ul>

<h3>Total: <span id="sumResult" aria-live="assertive">0</span></h3>


<script>
// --------- Voz ---------
function speak(text) {
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "es-ES";
    speechSynthesis.speak(msg);

    if (navigator.vibrate) navigator.vibrate(100);
}

// --------- Guía Inicial ---------
window.onload = () => {
    speak("Bienvenido. Esta aplicación es accesible para personas ciegas.");
    speak("Para comenzar, apunte la cámara hacia un billete y presione el botón Escanear Billete.");
    speak("También puede presionar la tecla ese para escanear, te para terminar y u para cargar una imagen.");
};

// --------- Iniciar Cámara ---------
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById("camera").srcObject = stream;
        speak("Cámara activada. Puedes escanear un billete cuando quieras.");
    } catch (err) {
        speak("No se pudo activar la cámara.");
    }
}
startCamera();

// --------- Historial ---------
let historyData = [];
function renderHistory() {
    const ul = document.getElementById("history");
    ul.innerHTML = "";

    historyData.forEach((item, i) => {
        let li = document.createElement("li");
        li.innerText = `Registro ${i + 1}: ${item.class} dólares, confianza del ${Math.round(item.confidence * 100)} por ciento.`;
        ul.appendChild(li);
    });
}

// --------- Escanear Billete ---------
async function scanFromCamera() {
    speak("Escaneando. Un momento.");

    let video = document.getElementById("camera");
    let canvas = document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    let blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg"));
    const formData = new FormData();
    formData.append("image", blob);

    const res = await fetch("/predict", { method: "POST", body: formData });
    const data = await res.json();

    document.getElementById("result").innerText =
        `Detectado: ${data.class} con ${(data.confidence * 100).toFixed(0)}%`;

    speak(`Billete detectado. Es un billete de ${data.class} dólares, con una confianza del ${(data.confidence * 100).toFixed(0)} por ciento.`);

    historyData.push(data); 
    renderHistory();
}

document.getElementById("scanBtn").onclick = scanFromCamera;

// --------- Subir Imagen ---------
document.getElementById("uploadBtn").onclick = () => {
    speak("Seleccione una imagen de un billete desde su dispositivo.");
    document.getElementById("imageInput").click();
};

document.getElementById("imageInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    speak("Procesando imagen.");

    const formData = new FormData();
    formData.append("image", file);

    const res = await fetch("/predict", { method: "POST", body: formData });
    const data = await res.json();

    speak(`Imagen procesada. Es un billete de ${data.class} dólares, con ${(data.confidence * 100).toFixed(0)} por ciento de confianza.`);

    historyData.push(data);
    renderHistory();
};

// --------- Sumar Billetes ---------
document.getElementById("sumBtn").onclick = () => {
    let total = 0;

    historyData.forEach(item => {
        let val = parseInt(item.class);
        if (!isNaN(val)) total += val;
    });

    document.getElementById("sumResult").innerText = total;
    speak(`La suma total de todos los billetes escaneados es ${total} dólares.`);
};

// --------- Atajos de teclado ---------
document.addEventListener("keydown", (e) => {
    if (e.key === "s") scanFromCamera();
    if (e.key === "t") document.getElementById("sumBtn").click();
    if (e.key === "u") document.getElementById("uploadBtn").click();
});

// --------- Anunciar cada botón cuando recibe foco ---------
document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("focus", () => {
        speak(btn.getAttribute("aria-label"));
    });
});
</script>

</body>
</html>
